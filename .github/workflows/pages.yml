name: Deploy website
run-name: Deploy site ${{ inputs.release_version && format('v{0}', inputs.release_version) || github.sha }}${{ inputs.release_request && format(' [{0}]', inputs.release_request) || '' }}

on:
  push:
    branches: [website]
  workflow_dispatch:
    inputs:
      release_version:
        description: "Optional product release version associated with this publication"
        required: false
        default: ""
        type: string
      release_request:
        description: "Optional release workflow correlation ID"
        required: false
        default: ""
        type: string
      studio_version:
        description: "Studio version that must be present in the generated changelog"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: reasonix-website-production
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/website'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Validate and build
        working-directory: site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STUDIO_RELEASE_VERSION: ${{ inputs.studio_version }}
        run: |
          npm ci
          npm test
          npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
